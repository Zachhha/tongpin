<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2eee5" />
    <title>卡池审核 · 同频</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/review.css" />
  </head>
  <body class="review-body">
    <div class="review-shell">
      <header class="review-head">
        <a class="review-brand" href="/">同频 <small>TONGPIN</small></a>
        <a class="review-back" href="/">返回首页</a>
      </header>

      <main class="review-main">
        <div class="review-intro">
          <p class="eyebrow">CARD REVIEW / 卡池审核</p>
          <h1>逐张决定：<br /><em>留，还是删。</em></h1>
          <p>每张卡展示标题、要点、公关点和短新闻。删除会立即从当前卡池移除。</p>
        </div>
        <section id="review-app" class="review-app" aria-live="polite">
          <div class="review-loading">正在读取卡池…</div>
        </section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script src="/review.js" defer></script>
  </body>
</html>
